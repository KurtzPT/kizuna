# Groups GitHub's auto-generated release notes ("Generate release notes") by
# the labels of the merged pull requests. Release pull requests (dev -> main,
# label "release") are left out: the notes list what they brought in instead.
# So are pull requests labelled "internal": a refactor, tests or CI, with
# nothing in them a user can see.
# A pull request is listed once, under the first category that matches. The
# type labels (enhancement, bug: set by hand) come first, so they win over the
# area labels the labeler adds to almost every pull request; the areas only
# group what has neither.
changelog:
  exclude:
    labels: ["duplicate", "invalid", "wontfix", "question", "release", "internal"]
  categories:
    - title: ✨ New features
      labels: ["enhancement"]
    - title: 🐛 Bug fixes
      labels: ["bug"]
    - title: 📺 Matching and metadata
      labels: ["metadata"]
    - title: 🛠️ Migration script
      labels: ["migration"]
    - title: 🐳 Running Kizuna
      labels: ["running"]
    - title: 📖 Documentation
      labels: ["documentation"]
    - title: 📦 Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
