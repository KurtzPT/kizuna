# Groups GitHub's auto-generated release notes ("Generate release notes") by
# the labels of the merged pull requests. Release pull requests (dev -> main,
# label "release") are left out: the notes list what they brought in instead.
changelog:
  exclude:
    labels: ["duplicate", "invalid", "wontfix", "question", "release"]
  categories:
    - title: ✨ New features
      labels: ["enhancement"]
    - title: 📺 Matching and metadata
      labels: ["metadata"]
    - title: 🛠️ Migration script
      labels: ["migration"]
    - title: 🐳 Running Kizuna
      labels: ["running"]
    - title: 🐛 Bug fixes
      labels: ["bug"]
    - title: 📖 Documentation
      labels: ["documentation"]
    - title: 📦 Dependencies
      labels: ["dependencies"]
    - title: Other changes
      labels: ["*"]
