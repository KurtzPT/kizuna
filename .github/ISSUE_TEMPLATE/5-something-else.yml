name: 🐞 Something else (crashes, errors, odd behaviour)
description: Kizuna crashed, restarts by itself, shows an error, uses too much memory or disk, or does something none of the other forms cover.
title: "[bug] <what happens>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure which form fits? This one is fine. Logs may contain file paths: remove anything you don't want
        public. API keys and Plex tokens never appear in Kizuna's logs.

  - type: dropdown
    id: kind
    attributes:
      label: What kind of problem?
      options:
        - Kizuna crashed or restarts by itself
        - An error message
        - Too slow, or too much memory / disk
        - Something else
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Error messages word for word.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to make it happen again
      description: The steps, if you know them. *"Refresh All Metadata on a library of ~800 shows, after about 10 minutes…"*
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: crash
    attributes:
      label: Crash output
      description: |
        If it crashed: Go prints `panic:` and a list of `goroutine` lines when that happens. Paste everything from
        the first `panic:` line to the end. It's often only in Docker's log, not in `kizuna.log`:
        `docker logs kizuna 2>&1 | grep -A 200 -m 1 'panic:'`

        How often it restarted, and why Docker stopped it:
        `docker inspect kizuna --format 'restarts={{.RestartCount}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}'`
      render: shell

  - type: textarea
    id: logs
    attributes:
      label: Log from just before it happened
      description: |
        With `LOG_LEVEL=debug` if you can reproduce it. The last lines before the problem, and any `WARN` or `ERROR`:
        `docker logs kizuna 2>&1 | tail -100` and `grep -E 'level=(WARN|ERROR)' /change/me/logs/kizuna.log | tail -50`
      render: shell
    validations:
      required: true

  - type: textarea
    id: resources
    attributes:
      label: "Optional: memory and disk"
      description: |
        For slowness, memory or disk problems:
        `docker stats --no-stream kizuna` and `du -sh /change/me/cache /change/me/logs` and `df -h /change/me`
      render: shell

  - type: textarea
    id: settings
    attributes:
      label: Settings you changed
      description: |
        Every setting you changed, except the keys and names: for `ANIDB_CLIENT`, `TVDB_API_KEY`, `TVDB_PIN`,
        `TVDB_LEGACY_API_KEY`, `TMDB_API_KEY`, `MAL_CLIENT_ID` and `PLEX_TOKEN` just say *set* / *not set*. Settings can be in
        two places, so paste both; the commands leave out lines with KEY, PIN, CLIENT or TOKEN, but check
        before you post:
        - the settings file in the data folder: `grep -vE '^[[:space:]]*(#|$)|KEY|PIN|CLIENT|TOKEN' /change/me/kizuna.env`
        - the container's environment: `docker inspect kizuna --format '{{range .Config.Env}}{{println .}}{{end}}' | grep -vE 'KEY|PIN|CLIENT|TOKEN'`
      render: shell

  - type: input
    id: versions
    attributes:
      label: Versions and system
      description: "Kizuna: `curl http://<host>:32600/health` (or the image tag). Plex: Settings → General."
      placeholder: 'Kizuna 1.2.3 · Plex Media Server 1.43.0 · Docker 27 on Unraid 7 (amd64)'
    validations:
      required: true
