# CodeQL settings, read by the codeql workflow (codeql-action/init).
#
# go/log-injection is off: every log line goes through slog's text handler
# (newLogHandler, cmd/kizuna/main.go), which quotes a message, key or value
# holding a line break, so text from a request can't start a line that reads
# like another entry. TestLogLinesCantBeForged pins that. The rule can't see
# the handler, so it flagged every log line with a request value in it, and
# again each time such a line moved. If Kizuna ever logs another way, turn the
# rule back on (newLogHandler's comment points here).
query-filters:
  - exclude:
      id: go/log-injection
