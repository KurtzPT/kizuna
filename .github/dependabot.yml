# Weekly pull requests for outdated GitHub Actions and the distroless runtime
# image (pinned by digest: a new digest is a pull request too). A release must be
# 7 days old before it's proposed, so a hijacked or broken release has time to be
# pulled first. The dependabot-automerge workflow merges the pull requests
# against dev once the checks pass. The golang build image is skipped: its version follows go.mod (see the
# Dockerfile), so a Go upgrade is a go.mod change. Kizuna has no Go module
# dependencies outside the standard library, so there is nothing else to watch.
#
# Version updates go to dev and ship with the next release. Security updates
# can't be redirected: GitHub always opens them against the default branch
# (main), so treat one like a hotfix: squash it into main, release a patch
# version, then merge main back into dev.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    labels: ["dependencies"]

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: golang
    labels: ["dependencies"]
