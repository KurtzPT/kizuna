# Adds area labels (metadata, migration, running, documentation) to pull
# requests from the files they change; the rules are in .github/labeler.yml.
#
# pull_request_target so pull requests from forks can be labelled too: it runs
# this file from the base branch with a token that can write labels. It never
# checks out or runs the pull request's code, only reads its list of files.
# Dependabot and go-update pull requests already carry "dependencies".
name: labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, see above
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  label:
    name: label
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read       # read .github/labeler.yml
      pull-requests: write # add the labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
