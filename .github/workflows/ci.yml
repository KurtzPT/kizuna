# Fast checks on every push and pull request (the Docker workflow builds and
# publishes the image):
#   go       Go version in sync, gofmt, go vet, tests with the race detector
#   script   bash syntax, ShellCheck and the behaviour tests of the migration script
name: ci

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # the Dockerfile's GO_VERSION default is what a local docker build uses
      - name: Go version in sync
        run: |
          mod=$(awk '$1 == "go" {print $2}' go.mod)
          docker=$(sed -n 's/^ARG GO_VERSION=//p' Dockerfile)
          if [ "$mod" != "$docker" ]; then
            echo "::error file=Dockerfile::ARG GO_VERSION=$docker, but go.mod says go $mod: make them match"
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::these files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

  script:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bash syntax
        run: for f in scripts/*.sh; do bash -n "$f"; done

      - name: ShellCheck
        run: shellcheck --severity=warning scripts/*.sh

      - name: script tests
        run: bash scripts/kizuna-migrate_test.sh
