# CodeQL code scanning for the Go code and the workflows. Alerts show in the
# Security tab (per branch) and on pull requests. Advanced setup instead of
# GitHub's default setup, because default setup only scans the default branch
# (main), and the code lives on dev until a release.
name: codeql

on:
  push:
    branches: [main, dev]
    # docs only: nothing to analyze (Go code and workflows). Pull requests
    # stay unfiltered, like ci's.
    paths-ignore: ["**.md", "assets/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays 05:41 UTC: new queries find old code too
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        if: matrix.language == 'go'
        with:
          go-version-file: go.mod

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-and-quality

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
