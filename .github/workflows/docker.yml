# Builds the image with Docker (tests run inside the build) and publishes it
# to GitHub Container Registry, ghcr.io/<owner>/<repo>:
#   push to dev         -> :dev and :sha-<short>                  (beta)
#   tag v1.2.3 on main  -> :1.2.3, :1.2, :latest and :sha-<short>  (stable)
#   tag v1.2.3-beta.1   -> :1.2.3-beta.1 and :sha-<short>          (never :latest)
#   push to main        -> build + test only: a release is the tag, not the merge
#   pull request        -> build + test only
#   manual run          -> like a push to that branch; on any other branch
#                          (e.g. a go-update PR) it only builds + tests
# Every published image gets a signed build provenance attestation, so anyone
# can check it was built here from this repo:
#   gh attestation verify oci://ghcr.io/kurtzpt/kizuna:<tag> -R KurtzPT/kizuna
# and carries an SBOM plus BuildKit's own provenance in the image index.
name: docker

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
    paths-ignore: ["**.md", ".github/ISSUE_TEMPLATE/**", "assets/**"]
  pull_request:
  workflow_dispatch:

permissions: {}

# a new push to a pull request replaces the run for the old one; pushes and
# tags always finish, so every published tag gets its image
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write     # push the image to GHCR
      id-token: write     # attestation: sign with the workflow's identity (Sigstore)
      attestations: write # attestation: store it on GitHub
    env:
      # publish only from dev or a release tag (pull requests have a refs/pull/... ref)
      PUBLISH: ${{ github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/tags/v') }}
      # a stable release: a v* tag without a pre-release part (v1.2.3, not v1.2.3-beta.1)
      STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the stable-tag check below needs main's history
          persist-credentials: false

      # :latest must only ever be something that was merged to main
      - name: stable tag is on main
        if: env.STABLE == 'true'
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME isn't on main. Stable releases are tagged on main; tag a beta (v1.2.3-beta.1) on dev"
            exit 1
          fi

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # image names must be lowercase: KurtzPT/kizuna -> ghcr.io/kurtzpt/kizuna
      - name: image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # build with the Go version from go.mod, not the Dockerfile default
      - name: go version
        run: echo "GO_VERSION=$(awk '$1 == "go" {print $2}' go.mod)" >> "$GITHUB_ENV"

      # what /health, the logs and Plex show: v1.2.3 for a tag, dev-<sha> for a
      # beta build, the short sha for anything else
      - name: kizuna version
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v=$GITHUB_REF_NAME
          elif [ "$GITHUB_REF" = refs/heads/dev ]; then v=dev-${GITHUB_SHA::7}
          else v=${GITHUB_SHA::7}
          fi
          echo "KIZUNA_VERSION=$v" >> "$GITHUB_ENV"

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev' }}
            type=raw,value=latest,enable=${{ env.STABLE == 'true' }}
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.KIZUNA_VERSION }}
            GO_VERSION=${{ env.GO_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # in the image index, next to each platform's image: an SPDX SBOM
          # (docker buildx imagetools inspect <image> --format '{{ json .SBOM }}')
          # and full BuildKit provenance (build args, base image digests)
          sbom: true
          provenance: mode=max

      # Signed SLSA build provenance for the image just pushed (all its tags
      # share this digest), stored on GitHub and next to the image in GHCR.
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false # storage records need an organization-owned repo
