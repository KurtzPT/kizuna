# Auto-merges Dependabot version updates against dev (squash) once the
# required checks pass, except a new major version of anything, which waits
# for a review. Security updates open against main and are never auto-merged
# (RELEASING.md, hotfix).
#
# A merge done with GITHUB_TOKEN doesn't start the push workflows, so after the
# merge this job starts ci and docker on dev itself: :dev gets rebuilt with the
# update (a new distroless digest, say) like after any other push.
# Needs: Settings -> General -> "Allow auto-merge".
name: dependabot-automerge

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: merge
    # the pull request's author, not github.actor (whoever triggered this run,
    # which can be spoofed); only Dependabot and maintainers can push to its
    # branches
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # merge
      pull-requests: write # turn on auto-merge
      actions: write       # start ci and docker on dev after the merge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      BODY: ${{ github.event.pull_request.body }}
    steps:
      # Dependabot writes "from 1.2.3 to 2.0.0" in the title of a single update
      # (maybe followed by "in the actions group") and a "| `1.2.3` | `2.0.0` |" table row per update in a group. A digest
      # update (`afa5c87` to `b1c2d3e`) has no version, so no major.
      - name: new major version?
        id: major
        run: |
          # shellcheck disable=SC2016 # the backticks are Dependabot's, not expansions
          pairs=$(
            { printf '%s\n' "$TITLE" | sed -nE 's/.* from `?v?([^ `]+)`? to `?v?([^ `]+)`?( .*)?$/\1 \2/p'
              printf '%s\n' "$BODY" | sed -nE 's/.*\| `v?([^`]+)` \| `v?([^`]+)` \|.*/\1 \2/p'
            } | sort -u
          )
          major=false
          while read -r from to; do
            [ -z "$from" ] && continue
            [[ $from =~ ^[0-9]+\. && $to =~ ^[0-9]+\. ]] || continue
            if [ "${from%%.*}" != "${to%%.*}" ]; then
              echo "::notice::$from -> $to is a new major version: review and merge it by hand"
              major=true
            fi
          done <<< "$pairs"
          echo "major=$major" >> "$GITHUB_OUTPUT"

      - name: turn on auto-merge
        if: steps.major.outputs.major == 'false'
        run: gh pr merge "$PR" --auto --squash

      - name: wait for the merge, then build dev
        if: steps.major.outputs.major == 'false'
        run: |
          while :; do
            state=$(gh pr view "$PR" --json state --jq .state)
            case $state in
              MERGED) break ;;
              CLOSED) echo "closed without a merge"; exit 0 ;;
            esac
            # auto-merge is turned off again when a check fails
            if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" != true ]; then
              echo "::warning::auto-merge was turned off (a check failed?): look at the pull request"
              exit 0
            fi
            sleep 30
          done
          gh workflow run ci.yml --ref dev
          gh workflow run docker.yml --ref dev
