# Auto-merges Dependabot version updates against dev (squash) once the
# required checks pass, except a new major version of anything, or an update
# it can't classify, which waits for a review. Security updates open against
# main and are never auto-merged (RELEASING.md, hotfix).
#
# A merge done with GITHUB_TOKEN doesn't start the push workflows, so after the
# merge this job starts ci and codeql on dev itself. ci publishes :dev with the
# update once its checks pass when the update changes the image (a new
# distroless digest, say), like after any other push; not for an Actions update.
# Needs: Settings -> General -> "Allow auto-merge".
name: dependabot-automerge

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: merge
    # the pull request's author, not github.actor (whoever triggered this run,
    # which can be spoofed); only Dependabot and maintainers can push to its
    # branches
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # merge
      pull-requests: write # turn on auto-merge
      actions: write       # start ci and codeql on dev after the merge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # Dependabot's own metadata (the YAML block in its commit message), read
      # by GitHub's action. It fails, and so nothing is merged, when the pull
      # request's commit isn't Dependabot's, signed.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Fails closed: only updates Dependabot marks as a minor or patch version
      # are merged. A new major version, or an update with no type that isn't a
      # Docker digest bump (`afa5c87` to `b1c2d3e`: no version, so no major),
      # waits for a review.
      - name: minor, patch or digest only?
        id: check
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          # one "name|type|from|to" line per update; fails the job if it can't be read
          rows=$(jq -er '.[] | [.dependencyName, (.updateType // ""), (.prevVersion // ""), (.newVersion // "")] | join("|")' <<< "$DEPS")
          merge=true
          while IFS='|' read -r name type from to; do
            case $type in
              version-update:semver-minor | version-update:semver-patch) ;;
              version-update:semver-major)
                echo "::notice::$name $from -> $to is a new major version: review and merge it by hand"
                merge=false
                ;;
              *)
                # shellcheck disable=SC2016 # the backticks are Dependabot's, not expansions
                if [ "$ECOSYSTEM" = docker ] && grep -qE ' from `[0-9a-f]{7,}` to `[0-9a-f]{7,}`' <<< "$TITLE"; then
                  echo "$name: a digest update"
                else
                  echo "::notice::$name ($from -> $to): couldn't tell what kind of update this is: review and merge it by hand"
                  merge=false
                fi
                ;;
            esac
          done <<< "$rows"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: turn on auto-merge
        if: steps.check.outputs.merge == 'true'
        run: gh pr merge "$PR" --auto --squash

      - name: wait for the merge, then check (and maybe publish) dev
        if: steps.check.outputs.merge == 'true'
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          while :; do
            # both in one call: a merge clears autoMergeRequest, so two calls
            # could see OPEN and then no auto-merge. A failed gh call fails the job.
            snap=$(gh pr view "$PR" --json state,autoMergeRequest --jq '"\(.state) \(.autoMergeRequest != null)"')
            read -r state auto <<< "$snap"
            case $state in
              MERGED) break ;;
              CLOSED) echo "closed without a merge"; exit 0 ;;
            esac
            # auto-merge is turned off again when a check fails
            if [ "$auto" != true ]; then
              echo "::warning::auto-merge was turned off (a check failed?): look at the pull request"
              exit 0
            fi
            sleep 30
          done
          # ci publishes :dev once its checks pass, but only for an update that
          # changes the image (the distroless digest, a Go module); an Actions
          # update would only add an identical sha-* image
          case $ECOSYSTEM in
            docker | go_modules | gomod) publish=true ;;
            *) publish=false ;;
          esac
          gh workflow run ci.yml --ref dev -f publish="$publish"
          gh workflow run codeql.yml --ref dev
