# Auto-merges Dependabot version updates against dev (squash) once the
# required checks pass, except a new major version of anything, an update it
# can't classify, or an update of the CI tools (.github/tools), which wait for
# a review. Security updates open against main and are never auto-merged: a
# hotfix goes to main as a pull request and is merged back into dev.
#
# A merge done with GITHUB_TOKEN doesn't start the push workflows, so after the
# merge this job starts ci and codeql on dev itself. ci publishes :dev with the
# update once its checks pass when the update changes the image (a new
# distroless digest, say), like after any other push; not for an Actions update.
# Needs: Settings -> General -> "Allow auto-merge".
name: dependabot-automerge

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  merge:
    name: merge
    # the pull request's author, not github.actor (whoever triggered this run,
    # which can be spoofed); only Dependabot and maintainers can push to its
    # branches
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write      # merge
      pull-requests: write # turn on auto-merge
      actions: write       # start ci and codeql on dev after the merge
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
    steps:
      # Dependabot's own metadata (the YAML block in its commit message), read
      # by GitHub's action. It fails, and so nothing is merged, when the pull
      # request's commit isn't Dependabot's, signed.
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Fails closed: only updates Dependabot marks as a minor or patch version
      # are merged. A new major version, or an update with no type that isn't a
      # Docker digest bump (`afa5c87` to `b1c2d3e`: no version, so no major),
      # waits for a review.
      - name: minor, patch or digest only?
        id: check
        env:
          DEPS: ${{ steps.meta.outputs.updated-dependencies-json }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          # one "name|type|from|to" line per update; fails the job if it can't be read
          rows=$(jq -er '.[] | [.dependencyName, (.updateType // ""), (.prevVersion // ""), (.newVersion // "")] | join("|")' <<< "$DEPS")
          merge=true
          # Actions and the runtime image only. The other ecosystems are the
          # CI tools in .github/tools (gomod, pip): actionlint and zizmor
          # run in the workflows check, which a merge doesn't wait for, so
          # a new version that fails it would be merged.
          case $ECOSYSTEM in
            github_actions | docker) ;;
            *)
              echo "::notice::a $ECOSYSTEM update (the CI tools): review and merge it by hand once every check passed"
              merge=false
              ;;
          esac
          while IFS='|' read -r name type from to; do
            case $type in
              version-update:semver-minor | version-update:semver-patch) ;;
              version-update:semver-major)
                echo "::notice::$name $from -> $to is a new major version: review and merge it by hand"
                merge=false
                ;;
              *)
                # shellcheck disable=SC2016 # the backticks are Dependabot's, not expansions
                if [ "$ECOSYSTEM" = docker ] && grep -qE ' from `[0-9a-f]{7,}` to `[0-9a-f]{7,}`' <<< "$TITLE"; then
                  echo "$name: a digest update"
                else
                  echo "::notice::$name ($from -> $to): couldn't tell what kind of update this is: review and merge it by hand"
                  merge=false
                fi
                ;;
            esac
          done <<< "$rows"
          echo "merge=$merge" >> "$GITHUB_OUTPUT"

      - name: turn on auto-merge
        if: steps.check.outputs.merge == 'true'
        run: |
          # --auto fails when all required checks already passed (e.g. on reopened)
          if ! out=$(gh pr merge "$PR" --auto --squash 2>&1); then
            case $out in
              *"Pull request is in clean status"* | *"Pull request is in unstable status"*)
                gh pr merge "$PR" --squash
                ;;
              *)
                printf '%s\n' "$out" >&2
                exit 1
                ;;
            esac
          elif [ -n "$out" ]; then
            printf '%s\n' "$out"
          fi

      - name: wait for the merge, then check (and maybe publish) dev
        if: steps.check.outputs.merge == 'true'
        env:
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          settled=false
          while :; do
            # all fields in one call: a merge clears autoMergeRequest, so two
            # calls could see OPEN and then no auto-merge. A failed gh call fails the job.
            # shellcheck disable=SC2016 # jq variables, not shell expansions
            snap=$(gh pr view "$PR" --json state,autoMergeRequest,statusCheckRollup --jq '
              [(.statusCheckRollup // [])[]
                | select((.__typename == "CheckRun" and .workflowName == "dependabot-automerge") | not)] as $checks
              | ($checks | map(select(
                  (.__typename == "CheckRun" and .status != "COMPLETED") or
                  (.__typename == "StatusContext" and (.state == "PENDING" or .state == "EXPECTED"))
                )) | length) as $pending
              | ($checks | map(
                  if .__typename == "CheckRun" and (.conclusion | IN("FAILURE", "TIMED_OUT", "ACTION_REQUIRED", "STARTUP_FAILURE", "CANCELLED")) then .name
                  elif .__typename == "StatusContext" and (.state | IN("FAILURE", "ERROR")) then .context
                  else empty end
                ) | unique | join(", ")) as $failed
              | "\(.state)\t\(.autoMergeRequest != null)\t\($pending)\t\($failed)"
            ')
            IFS=$'\t' read -r state auto pending failed <<< "$snap"
            case $state in
              MERGED) break ;;
              CLOSED) echo "closed without a merge"; exit 0 ;;
            esac
            if [ "$auto" != true ]; then
              echo "::warning::auto-merge was turned off: look at the pull request"
              exit 0
            fi
            # GitHub keeps autoMergeRequest enabled when a check fails. Wait
            # until no other check is pending, plus one poll so auto-merge can
            # finish if only a non-required check failed.
            if [ "$pending" -eq 0 ] && [ -n "$failed" ]; then
              if [ "$settled" = true ]; then
                echo "::warning::checks failed ($failed): look at the pull request"
                exit 0
              fi
              settled=true
            else
              settled=false
            fi
            sleep 30
          done
          # ci publishes :dev once its checks pass for an update that changes
          # the image (the distroless digest). An Actions update alone would
          # only add an identical sha-* image: with publish=false ci decides
          # like after a push (an update to docker.yml or the build-image
          # action changes the image; one that doesn't publishes only when
          # :dev is missing an earlier change). Only docker and
          # github_actions updates get here (the check above)
          case $ECOSYSTEM in
            docker) publish=true ;;
            *) publish=false ;;
          esac
          gh workflow run ci.yml --ref dev -f publish="$publish"
          gh workflow run codeql.yml --ref dev
