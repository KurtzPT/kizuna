\* ee1ebd7: sending did not check the ban and the backoff again, so a call
\* counted while it queued went out after the answer ahead brought a ban.
\* switches: SendingChecksPause
\* expect: Invariant NoSendWhilePaused is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = TRUE
    LeaveBeforeDone = TRUE
    SendingChecksPause = FALSE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE
    PauseBeforeLog = TRUE
    AnyErrorGivesBack = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
