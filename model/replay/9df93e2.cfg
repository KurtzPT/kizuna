\* 9df93e2: a network or server error blocked the anime for 24 h, as if
\* AniDB had answered about it. Only that half is replayed: the other, a
\* call with no answer given back from the day's count, is today's code
\* here (be65acf finished it).
\* switches: NoAnswerBlocksNoAnime
\* expect: Invariant FailedOnlyIfAnswered is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = FALSE
    PanicInDone = FALSE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = FALSE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
