\* Today's code, every rule. Must pass. The background share binds here
\* (BgLimit = 1), the daily limit does not: DailyLimit = 2 is the number of
\* anime, and an anime AniDB answered is not asked again. It binds in
\* AniDBCalls-daily-limit.cfg. A panic in sending or in result is left out
\* (model/findings); AniDBCalls-sending-panics.cfg checks the first against
\* the rules it keeps. Every config in replay/, defence/ and findings/ is
\* this one but for the constants its "switches:" line names.
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = FALSE
    PanicInDone = FALSE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
