\* Today's code with a panic in sending, under every rule but the two that
\* findings/panic-in-sending.cfg shows it breaks. Must pass. Outcomes
\* leaves out "badXML" and "client" (AniDBCalls.cfg has them) to keep the
\* run near 40 s: each also stays counted and blocks or pauses, as
\* "entryErr" and "ban" do. Once that finding is fixed, set
\* PanicInBefore = TRUE in AniDBCalls.cfg and delete this file and the
\* finding's.
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "ban", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = FALSE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
