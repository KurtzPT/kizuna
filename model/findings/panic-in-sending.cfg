\* Finding, not fixed yet: today's code with a panic in sending. A caller
\* that passes allowed and joins the download between sending's cleanup and
\* run leaving inflight keeps a call counted that no download sends: result
\* gives a joiner's count back only for anidbNotSent, and a panic arrives
\* as ErrPanicked. "No download sends it" holds in this model, whose three
\* callers ask once each. In Go the next ask for that anime after the
\* backoff joins the call and sends it, so until then it holds one of the
\* day's 200 calls. Once the code is fixed, this passes: see
\* AniDBCalls-sending-panics.cfg.
\* switches: PanicInBefore
\* expect: Invariant (NothingCountedLeftOver|CallingEmpty) is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = FALSE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
