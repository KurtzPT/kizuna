\* Finding, not fixed yet: a panic in result can drop AniDB's ban. In
\* result's ban case, c.state.Failed[aid] is set, then slog.Error("AniDB
\* banned this IP; ...") logs, and only then is c.state.BannedUntil set.
\* A log handler that panics there (the same source as panic-in-sending)
\* ends result early, and run's recover logs the panic and goes on. paused
\* sees no ban: only that anime is blocked, and calls for every other
\* anime go out during AniDB's ban. The client error case has the same
\* shape: its slog.Error comes before c.state.ClientRejected is set, so
\* nothing pauses, and even the same anime is asked again. run's recover
\* logs with slog.Error too, so a handler that panics on every Error line
\* panics again there and ends the process: only one that panics on this
\* message alone reaches the dropped ban. Once the code sets the pause
\* before it logs, this passes: set PanicInDone = TRUE in AniDBCalls.cfg
\* and delete this file.
\* switches: PanicInDone
\* expect: Invariant BanKept is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = FALSE
    PanicInDone = TRUE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
