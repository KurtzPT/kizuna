\* Not a replay: at 59ac75e^ fetch's download goroutine had no recover, so
\* a panic in Before ended the process. This drops one of the defences
\* 59ac75e added with the recover, before's deferred t.sent(): the host's
\* queue waits forever for a request that never went out.
\* switches: SentDeferred
\* expect: Invariant HostQueueMoves is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = TRUE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = FALSE
    PauseBeforeLog = TRUE
    AnyErrorGivesBack = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
