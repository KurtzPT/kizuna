\* Not a replay: this drops the "if entry.answered" that d40bf6a added
\* to result's entry-error case, from today's code, where that case also
\* clears RetryAt: a slow answer that doesn't parse (a cut-off answer,
\* another server's page) then ends the backoff while the outage goes on.
\* At d40bf6a^ the case reset only the count of failures in a row, which
\* sets how long the next backoff is, and the model has no backoff
\* lengths. RetryAt was first cleared there in 6cc1c3c, after d40bf6a.
\* switches: OnlyAnswerEndsBackoff
\* expect: Invariant BackoffKept is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = TRUE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = FALSE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE
    PauseBeforeLog = TRUE
    AnyErrorGivesBack = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
