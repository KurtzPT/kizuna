\* Not a replay: at 59ac75e^ fetch's download goroutine had no recover, so
\* a panic in Before ended the process. This drops one of the defences
\* 59ac75e added with the recover, sending's deferred cleanup: the call it
\* would have sent stays under way, marked sent, and every later caller
\* joins it and is refused until a restart.
\* switches: PanicInBefore SendingCleansUp
\* expect: Invariant SentCallHasDownload is violated
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 2
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = FALSE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = FALSE
    SentDeferred = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
