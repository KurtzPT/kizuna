\* Today's code with a daily limit of one call, so that admit's daily
\* limit check binds: the second anime's caller is refused while the
\* first anime's call is counted. Must pass.
SPECIFICATION Spec

CONSTANTS
    DailyLimit = 1
    BgLimit = 1
    Outcomes = {"ok", "entryErr", "badXML", "ban", "client", "netErr", "panic"}
    PanicInBefore = TRUE
    PanicInDone = TRUE
    LeaveBeforeDone = TRUE
    SendingChecksPause = TRUE
    JustEndedGuard = TRUE
    ResultGivesBackJoined = TRUE
    OnlyAnswerEndsBackoff = TRUE
    ClientErrorPauses = TRUE
    NoAnswerBlocksNoAnime = TRUE
    TakeBackFetched = TRUE
    SendingCleansUp = TRUE
    SentDeferred = TRUE
    PauseBeforeLog = TRUE
    AnyErrorGivesBack = TRUE

INVARIANTS
    NoSendWhilePaused
    NoBackgroundSendWhenStopping
    NotAskedAgain
    BanKept
    BackoffKept
    SentIsCounted
    NothingCountedLeftOver
    LimitKept
    BackgroundShareKept
    OneRequestPerAnime
    SentCallHasDownload
    HostQueueMoves
    CallingEmpty
    FetchedOnlyIfKept
    FailedOnlyIfAnswered
