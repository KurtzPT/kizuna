# docker compose up -d
# Replace /change/me below with your data folder before starting.
# Settings, your keys included, go in kizuna.env in that folder: start from .env.sample,
# see SETUP.md step 2 and SETTINGS.md.
services:
  kizuna:
    image: ghcr.io/kurtzpt/kizuna:latest
    # build: .               # or build locally instead of pulling
    container_name: kizuna
    restart: unless-stopped
    stop_grace_period: 35s   # lets running Plex requests finish on stop (Docker's default is 10s)
    user: "1000:1000"        # uid:gid that can write the data folder (/change/me)
    # Locked down: Kizuna only ever writes to /data, needs no Linux capabilities
    # and never gains privileges. Remove a line only if you know you need it.
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # A setting here wins over kizuna.env, even "". Only for overriding the file, e.g. for a quick test:
    # environment:
    #   LOG_LEVEL: "debug"
    ports:
      - "32600:32600"        # host:container. Another port on this machine: change the FIRST number (e.g. "32700:32600").
                             # Keep it on your LAN; Plex can't authenticate to providers
    volumes:
      # Data folder on this machine: settings file (kizuna.env), cache, AniDB state, mapping corrections, match reports and logs
      # (logs/kizuna.log, older days logs/kizuna-YYYY-MM-DD.log). Must be writable by the user above.
      - /change/me:/data
